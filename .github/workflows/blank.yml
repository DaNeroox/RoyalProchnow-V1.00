name: APK bauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Projekt vorbereiten
        run: |
          mkdir -p www
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip -d entpackt
            cp -r entpackt/*/www/. www/
          else
            cp "$(ls *.html | head -n 1)" www/index.html
          fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Prochnow Royal" de.prochnow.royal --web-dir=www
          npx cap add android
          npx cap sync android

      - name: App-Symbol einbauen
        run: |
          command -v convert >/dev/null || sudo apt-get install -y imagemagick
          ICON=$(ls icon-only*.png 2>/dev/null | head -n 1)
          if [ -z "$ICON" ]; then
            echo "::warning::icon-only.png wurde im Repository nicht gefunden"
            exit 0
          fi
          RES=android/app/src/main/res
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=${d%%:*}
            size=${d##*:}
            mkdir -p $RES/mipmap-$dir
            convert "$ICON" -resize ${size}x${size} $RES/mipmap-$dir/ic_launcher.png
            cp $RES/mipmap-$dir/ic_launcher.png $RES/mipmap-$dir/ic_launcher_round.png
          done
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Symbol eingebaut aus $ICON"
          ls -R $RES | grep -i launcher

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prochnow-Royal.apk
          gh release create "apk-${{ github.run_number }}" Prochnow-Royal.apk --title "Prochnow Royal APK ${{ github.run_number }}" --notes "Debug-APK zum Installieren auf Android."
