name: APK bauen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Projekt vorbereiten
        run: |
          mkdir -p www
          if ls *.zip >/dev/null 2>&1; then
            unzip -o *.zip -d entpackt
            cp -r entpackt/*/www/. www/
          else
            cp "$(ls *.html | head -n 1)" www/index.html
          fi
          ls -la www
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Prochnow Royal" de.prochnow.royal --web-dir=www
          npx cap add android
          npx cap sync android

      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Prochnow-Royal.apk
          gh release create "apk-${{ github.run_number }}" Prochnow-Royal.apk --title "Prochnow Royal APK ${{ github.run_number }}" --notes "Debug-APK zum Installieren auf Android."
